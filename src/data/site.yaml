projects:
  - id: truckpad-bi
    kind: main
    client: truckpad
    consultancy: ITIX
    title:
      pt: Reestruturação do BI
      en: BI restructuring
    period:
      start: "2026"
      end:
    problem:
      pt: >-
        O BI dependia de pipelines legados e de painéis sem controle de versão,
        com dados espalhados entre MongoDB, PostgreSQL e Oracle.
      en: >-
        BI relied on legacy pipelines and dashboards without version control,
        with data scattered across MongoDB, PostgreSQL and Oracle.
    role:
      pt: >-
        Responsável pela nova arquitetura: migração para o Airflow, stages
        incrementais do MongoDB e do PostgreSQL, DW dimensional em PostgreSQL
        com frameworks de dimensão e fato, uma camada de views só de leitura
        para o Power BI, DAGs de teste, de backfill e de atualização dos
        painéis, versionamento dos painéis no Git e atendimento às solicitações
        de titulares da LGPD.
      en: >-
        Owner of the new architecture: migration to Airflow, incremental stages
        from MongoDB and PostgreSQL, a dimensional DW in PostgreSQL with
        dimension and fact frameworks, a read-only view layer for Power BI,
        DAGs for testing, backfill and dashboard refresh, dashboard version
        control in Git, and handling of data subject requests under the LGPD
        (Brazil's data protection law).
    stack:
      - Python
      - Apache Airflow
      - MongoDB
      - PostgreSQL
      - Oracle
      - SQL Server
      - Power BI
      - Docker

  - id: jsl-invoice-automation
    kind: main
    client: jsl
    consultancy: ITIX
    title:
      pt: Automação do pagamento de notas
      en: Invoice payment automation
    period:
      start: "2026"
      end: "2026"
    problem:
      pt: >-
        As requisições de compra das notas de serviço eram lançadas à mão no
        SAP, a partir de planilhas, e-mails e anexos do SharePoint.
      en: >-
        Purchase requisitions for service invoices were entered into SAP by
        hand, from spreadsheets, e-mails and SharePoint attachments.
    role:
      pt: >-
        Principal desenvolvedor do robô que lê a planilha de governança, cruza
        com o faturamento enviado pelo fornecedor por e-mail, cria as
        requisições no SAP, padroniza os anexos e devolve o status e o
        aprovador à planilha, com uma interface desktop para a operação.
      en: >-
        Lead developer of the bot that reads the governance spreadsheet,
        matches it against the billing the supplier sends by e-mail, creates
        the requisitions in SAP, standardizes the attachments and writes the
        status and the approver back to the spreadsheet, with a desktop
        interface for the operations team.
    stack:
      - Python
      - SAP GUI Scripting
      - Selenium
      - pandas
      - MySQL
      - Microsoft 365 (MSAL)
      - SharePoint
      - PySide6
      - pypdf

  - id: jsl-selenium-bot
    kind: timeline
    client: jsl
    consultancy: ITIX
    title:
      pt: Robô com Selenium
      en: Selenium bot
    period:
      start: "2025-11"
      end: "2026-03"

  - id: integral-medica-cdp
    kind: main
    client: integral-medica
    consultancy: ITIX
    title:
      pt: Customer Data Platform (CDP)
      en: Customer Data Platform (CDP)
    period:
      start: "2024"
      end: "2026"
    problem:
      pt: >-
        Dados de clientes das várias marcas do grupo espalhados entre
        e-commerce, marketplace, CRM, atendimento e redes sociais, sem uma
        visão única do cliente.
      en: >-
        Customer data from the group's many brands was scattered across
        e-commerce, marketplaces, CRM, customer service and social media, with
        no single view of the customer.
    role:
      pt: >-
        Um dos dois principais desenvolvedores: ingestão de VTEX, Shopify,
        AnyMarket, Salesforce Marketing Cloud, Zendesk, Instagram, TikTok e
        YouTube; unificação do cliente (nome, e-mail, telefone, endereço,
        nascimento e gênero) com a origem de cada dado; DAGs de validação; e a
        infraestrutura do Airflow em Docker.
      en: >-
        One of the two lead developers: ingestion from VTEX, Shopify,
        AnyMarket, Salesforce Marketing Cloud, Zendesk, Instagram, TikTok and
        YouTube; customer unification (name, e-mail, phone, address, date of
        birth and gender) keeping the source of each field; validation DAGs;
        and the Airflow infrastructure on Docker.
    stack:
      - Python
      - Apache Airflow
      - PostgreSQL
      - SQL Server
      - REST APIs
      - Google Cloud
      - Selenium
      - Docker

  - id: unimed-dw
    kind: main
    client: unimed-goiania
    consultancy: ITIX
    title:
      pt: Data warehouse corporativo
      en: Corporate data warehouse
    period:
      start: "2022"
      end: "2025"
    problem:
      pt: >-
        As áreas de negócio de uma das maiores operadoras de saúde do país
        dependiam de relatórios manuais e consultas diretas ao sistema de
        gestão, sem uma visão única dos dados.
      en: >-
        The business areas of one of the country's largest health insurance
        providers relied on manual reports and direct queries to the
        management system, with no single view of the data.
    role:
      pt: >-
        Engenheiro de dados no time que construiu e manteve o DW em camadas
        (stage, ODS, DW e tabelas flat), com data marts de auditoria de
        autorizações, contas médicas, faturamento, controladoria, regulação
        médica, perfil e saúde da carteira, rede credenciada, sinistralidade e
        gestão de pessoas; um framework interno de stages, dimensões e fatos; e
        a publicação automática de extratos no Tableau.
      en: >-
        Data engineer on the team that built and maintained the layered DW
        (stage, ODS, DW and flat tables), with data marts for authorization
        audit, medical claims, billing, controllership, medical regulation,
        member portfolio profile and health, provider network, loss ratio and
        people management; an internal framework for stages, dimensions and
        facts; and automated publishing of extracts to Tableau.
    stack:
      - Python
      - Apache Airflow
      - Oracle
      - PostgreSQL
      - SQLAlchemy
      - pandas
      - PyArrow
      - Tableau (Hyper API, Server Client)
      - Docker

  - id: skystone-bi
    kind: occasional
    client: skystone
    consultancy: ITIX
    title:
      pt: BI
      en: BI
    period:
      start: "2025-07"
      end: "2025-07"
    summary:
