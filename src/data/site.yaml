    stack:
      - Apache Airflow

  - id: vita-omie-integration
    kind: main
    client: vita
    consultancy: ITIX
    title:
      pt: Integração com o ERP Omie
      en: Omie ERP integration
    period:
      start: "2025"
      end: "2025"
    problem:
      pt: >-
        Os dados financeiros e operacionais do ERP Omie não estavam integrados
        a relatórios e dashboards.
      en: >-
        Financial and operational data from the Omie ERP was not integrated
        with reports and dashboards.
    role:
      pt: >-
        Parte do time que construiu uma API serverless que extrai os dados da
        API do Omie, trata com pandas, grava no PostgreSQL e alimenta os
        dashboards.
      en: >-
        Part of the team that built a serverless API that extracts data from
        the Omie API, transforms it with pandas, loads it into PostgreSQL and
        feeds the dashboards.
    stack:
      - Python
      - FastAPI
      - AWS Lambda (Mangum)
      - API Gateway
      - Secrets Manager
      - S3
      - pandas
      - PostgreSQL

  - id: academia-foguete-data-analysis
    kind: occasional
    client: academia-foguete
    consultancy: ITIX
    title:
      pt: Análise de dados
      en: Data analysis
    period:
      start: "2025-05"
      end: "2025-06"
    summary:
      pt: >-
        Extração das informações de eventos via API e armazenamento no
        PostgreSQL, para uma plataforma de streaming de cursos.
      en: >-
        Extraction of event data through an API and storage in PostgreSQL, for
        an online course streaming platform.
    stack:
      - Apache Airflow
      - PostgreSQL
      - pandas

  - id: unimed-rpa
    kind: timeline
