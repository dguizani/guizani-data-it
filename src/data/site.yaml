    pt: >-
      Sou Davi Guizani, engenheiro de dados com mais de 5 anos de experiência e
      fundador da Guizani Data IT. Construo pipelines, data warehouses e
      automações para empresas de saúde, varejo, logística e investimentos,
      sempre com o mesmo objetivo: dados confiáveis, no lugar certo, para quem
      precisa decidir.
    en: >-
      I'm Davi Guizani, a data engineer with more than 5 years of experience and
      the founder of Guizani Data IT. I build pipelines, data warehouses and
      automation for companies in healthcare, retail, logistics and
      investments, always with the same goal: reliable data, in the right
      place, for the people who make decisions.
